# =============================================================================
# File    : mosquitto.conf
# Purpose : Eclipse Mosquitto broker configuration for CardioSense (dev compose stack).
# Logic   : TLS only (no plaintext listener exists), no anonymous clients, passwords from a file built at start-up.
#           Everything is MQTT over TLS 1.2+ on port 8883, matching the "no plaintext hop between the device and the
#           browser" rule. Prototype limitation: one shared user; production needs per-device credentials and an ACL
#           restricting each device to devices/<its serial>/#.
# =============================================================================
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
