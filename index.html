<!doctype html>
<!--
  The `lang`/`dir` attributes here are just the pre-hydration default
  (Arabic/RTL, matching VITE_DEFAULT_LANGUAGE). Once React mounts,
  I18nProvider (src/app/providers/I18nProvider.tsx) takes over and keeps
  these two attributes in sync with the active language on every change.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E14" />
    <!-- This is a research prototype / demo: keep it out of search results.
         Remove this tag (and the X-Robots-Tag header in vercel.json) to allow indexing. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="CardioSense — clinical tele-cardiology monitoring platform (AI-assisted insights, prototype)."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>CardioSense</title>
  </head>
  <body>
    <noscript>CardioSense needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
